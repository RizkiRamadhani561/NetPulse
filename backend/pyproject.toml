[build-system]
requires = ["setuptools>=75.8,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse-backend"
version = "0.1.0"
description = "NetPulse network monitoring API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "fastapi==0.143.2",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy==2.1.4",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
