name: Feature request
description: Propose a user-facing improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy
      options:
        - label: This does not require scanning unauthorized networks or exposing secrets.
          required: true
