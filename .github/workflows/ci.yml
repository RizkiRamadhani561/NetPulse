name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation and backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Verify structure
        run: python scripts/verify_project.py --mode quick

      - name: Ruff lint
        run: ruff check backend/app backend/tests scripts

      - name: Ruff format
        run: ruff format --check backend/app backend/tests scripts

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend typecheck, build, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
