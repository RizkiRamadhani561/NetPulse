name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation and backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Quick verification gate
        run: bash ./scripts/verify.sh --quick

      - name: Ruff lint
        working-directory: backend
        run: uv run --locked --extra dev ruff check app tests ../scripts

      - name: Ruff format
        working-directory: backend
        run: uv run --locked --extra dev ruff format --check app tests ../scripts

      - name: Static type check
        working-directory: backend
        run: uv run --locked --extra dev mypy app

      - name: Backend tests and coverage
        working-directory: backend
        run: uv run --locked --extra dev pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: API runtime smoke without Docker
        working-directory: backend
        run: uv run --locked --extra dev python ../scripts/smoke_api.py

      - name: Backend dependency audit
        working-directory: backend
        run: uv run --locked --extra dev pip-audit

  windows-quick:
    name: Windows PowerShell and API runtime checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Run the PowerShell quick gate
        shell: pwsh
        run: ./scripts/verify.ps1 -Mode quick

      - name: API runtime smoke on Windows
        working-directory: backend
        run: uv run --locked --extra dev python ../scripts/smoke_api.py

  frontend:
    name: Frontend typecheck, build, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Storybook production build
        working-directory: frontend
        run: npm run build-storybook

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install pinned browser verification tools
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/netpulse-ui-tools"
          mkdir -p "$tool_dir"
          cat > "$tool_dir/package.json" <<'JSON'
          {
            "name": "netpulse-ui-verification",
            "private": true,
            "devDependencies": {
              "@axe-core/playwright": "4.14.0",
              "playwright": "1.64.1"
            }
          }
          JSON
          npm install --prefix "$tool_dir" --no-audit --no-fund --save-exact
          npm audit --prefix "$tool_dir" --audit-level=high
          "$tool_dir/node_modules/.bin/playwright" install --with-deps chromium

      - name: Browser, keyboard, responsive, and accessibility checks
        run: node scripts/verify_ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/netpulse-ui-tools/node_modules
          NETPULSE_UI_ARTIFACTS: ${{ runner.temp }}/netpulse-ui-artifacts

      - name: Upload Phase 0 browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase0-ui-review-${{ github.run_id }}
          path: ${{ runner.temp }}/netpulse-ui-artifacts/
          if-no-files-found: warn
          retention-days: 14

  container-smoke:
    name: Docker Compose smoke test
    if: github.event_name == 'workflow_dispatch'
    needs: [foundation, frontend, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate and start the stack
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            local status=$?
            if [[ "$status" -ne 0 ]]; then
              docker compose ps || true
              docker compose logs --no-color --tail 150 || true
            fi
            docker compose down --remove-orphans
            return "$status"
          }
          trap cleanup EXIT

          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180

          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:8000/api/v1/health >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:3000/api/health >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:3000/ >/dev/null

          ready_code="$(curl --silent --show-error --output readiness.json --write-out '%{http_code}' --max-time 5 \
            http://127.0.0.1:8000/api/v1/ready)"
          test "$ready_code" = "503"
          python -c 'import json; assert json.load(open("readiness.json", encoding="utf-8"))["status"] == "not_ready"'

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
