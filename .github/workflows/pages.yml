name: Publish project site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "frontend/public/brand/**"
      - "docs/BRAND_GUIDELINES.md"
      - ".github/workflows/pages.yml"
      - "scripts/verify_site.py"
  pull_request:
    branches: [main]
    paths:
      - "docs/site/**"
      - "frontend/public/brand/**"
      - "docs/BRAND_GUIDELINES.md"
      - ".github/workflows/pages.yml"
      - "scripts/verify_site.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _site/assets/brand
          cp -R docs/site/. _site/
          cp -R frontend/public/brand/. _site/assets/brand/
          test -s _site/index.html
          test -s _site/docs.html
          test -s _site/styles.css
          test -s _site/site.js
          test -s _site/assets/brand/netpulse-mark.svg
          test -s _site/assets/brand/netpulse-logo.svg
          test -s _site/assets/brand/favicon.svg
          test -s _site/assets/brand/github-banner.svg
          test -s _site/assets/brand/login-background.svg
          python scripts/verify_site.py --root _site
          if grep -RInE 'canva\.com/.+watermark|media\.canva\.com/.+token=' _site; then
            echo "A transient Canva preview URL was found in the static artifact." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
