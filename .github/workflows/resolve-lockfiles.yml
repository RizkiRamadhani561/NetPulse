name: Resolve dependency lockfiles

on:
  push:
    paths:
      - ".github/workflows/resolve-lockfiles.yml"

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and package lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"

      - name: Install uv and resolve Python dependencies
        working-directory: backend
        run: |
          python -m pip install uv==0.10.0
          uv lock --python "$(command -v python)" --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"

      - name: Resolve npm dependencies
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload resolved lockfiles
        uses: actions/upload-artifact@v6
        with:
          name: netpulse-dependency-lockfiles
          path: |
            backend/uv.lock
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
